<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background -->
  <rect width="100" height="100" fill="#0f172a" rx="10"/>
  
  <!-- Map/Route Base -->
  <circle cx="50" cy="50" r="35" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.3"/>
  
  <!-- Compass/Navigation Lines -->
  <line x1="50" y1="20" x2="50" y2="35" stroke="#3b82f6" stroke-width="2"/>
  <line x1="80" y1="50" x2="65" y2="50" stroke="#3b82f6" stroke-width="2"/>
  
  <!-- Vehicle/Tracker Icon (simplified vehicle) -->
  <g transform="translate(50, 50)">
    <!-- Vehicle body -->
    <rect x="-12" y="-18" width="24" height="20" rx="3" fill="#10b981" opacity="0.9"/>
    
    <!-- Windows -->
    <rect x="-10" y="-16" width="6" height="5" fill="#60a5fa" opacity="0.7"/>
    <rect x="4" y="-16" width="6" height="5" fill="#60a5fa" opacity="0.7"/>
    
    <!-- Wheels -->
    <circle cx="-8" cy="4" r="3" fill="#1f2937"/>
    <circle cx="8" cy="4" r="3" fill="#1f2937"/>
    
    <!-- GPS Point -->
    <circle cx="0" cy="-8" r="2" fill="#ef4444" opacity="0.9"/>
    <circle cx="0" cy="-8" r="4" fill="none" stroke="#ef4444" stroke-width="1" opacity="0.5"/>
  </g>
  
  <!-- Accent dots for navigation -->
  <circle cx="25" cy="35" r="2" fill="#06b6d4" opacity="0.7"/>
  <circle cx="75" cy="65" r="2" fill="#06b6d4" opacity="0.7"/>
</svg>
